name: Déployer REZONN sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances (sharp)
        run: npm install --no-audit --no-fund

      - name: Optimiser les photos et générer le site (dist/)
        run: node scripts/build.js

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Créer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
